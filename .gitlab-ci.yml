# Intel/AMD x86-64 only. Linux needs an x64 Docker executor.
# Windows is opt-in on an x64 shell runner with VS2022 Clang tools/Python.
# Build artifacts only; no deployment or remote release writes.
stages: [verify]

linux-x64:
  image: ubuntu:24.04
  stage: verify
  before_script:
    - test "$(uname -m)" = x86_64
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build gcc libcurl4-openssl-dev:amd64 python3
  script:
    - |
      cmake -S . -B build-linux-x64 -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel \
        -DTB_TARGET_ARCH=x64 -DCMAKE_C_COMPILER=gcc \
        -DCMAKE_C_FLAGS=-m64 -DCMAKE_EXE_LINKER_FLAGS=-m64 \
        -DCURL_NO_CURL_CMAKE=TRUE \
        -DCURL_INCLUDE_DIR=/usr/include/x86_64-linux-gnu \
        -DCURL_LIBRARY=/usr/lib/x86_64-linux-gnu/libcurl.so
    - cmake --build build-linux-x64 --parallel 2
    - python3 test_arch.py build-linux-x64/telemetry_send --arch x64
    - python3 test_arch.py build-linux-x64/telemetry_monitor --arch x64
    - ctest --test-dir build-linux-x64 --output-on-failure
    - python3 test_core.py --skip-build --executable build-linux-x64/test_telemetry
    - python3 test_sender.py build-linux-x64/telemetry_send
    - python3 test_confirmation.py build-linux-x64/telemetry_send
    - python3 test_monitor.py build-linux-x64/telemetry_send --monitor-executable build-linux-x64/telemetry_monitor
    - python3 test_sender_limits.py build-linux-x64/telemetry_send
    - cmake --install build-linux-x64 --prefix "$CI_PROJECT_DIR/stage/linux-x64"
    - cpack --config build-linux-x64/CPackConfig.cmake -G TGZ -B dist/linux-x64
  artifacts:
    name: telemetry-linux-x64
    paths: [dist/linux-x64/*.tar.gz]
    expire_in: 14 days

windows-x64:
  stage: verify
  tags: [windows, x64]
  rules:
    - if: '$RUN_WINDOWS_BUILD == "1"'
  script:
    - cmake -S . -B build-windows-x64 -G "Visual Studio 17 2022" -A x64 -T ClangCL -DTB_TARGET_ARCH=x64
    - cmake --build build-windows-x64 --config MinSizeRel --parallel 2
    - python test_arch.py build-windows-x64/MinSizeRel/telemetry_send.exe --arch x64
    - python test_arch.py build-windows-x64/MinSizeRel/telemetry_monitor.exe --arch x64
    - ctest --test-dir build-windows-x64 -C MinSizeRel --output-on-failure
    - python test_core.py --skip-build --executable build-windows-x64/MinSizeRel/test_telemetry.exe
    - python test_sender.py build-windows-x64/MinSizeRel/telemetry_send.exe
    - python test_confirmation.py build-windows-x64/MinSizeRel/telemetry_send.exe
    - python test_monitor.py build-windows-x64/MinSizeRel/telemetry_send.exe --monitor-executable build-windows-x64/MinSizeRel/telemetry_monitor.exe
    - python test_sender_limits.py build-windows-x64/MinSizeRel/telemetry_send.exe
    - cmake --install build-windows-x64 --config MinSizeRel --prefix "$env:CI_PROJECT_DIR/stage/windows-x64"
    - cpack --config build-windows-x64/CPackConfig.cmake -C MinSizeRel -G ZIP -B dist/windows-x64
  artifacts:
    name: telemetry-windows-x64
    paths: [dist/windows-x64/*.zip]
    expire_in: 14 days
