# Default runner: Linux Docker executor, x86-64. No deployment or remote writes.
stages: [verify]
linux-amd64:
  image: ubuntu:24.04
  stage: verify
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build gcc libcurl4-openssl-dev python3
  script:
    - test "$(uname -m)" = x86_64
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_C_COMPILER=gcc
    - cmake --build build --parallel 2
    - ctest --test-dir build --output-on-failure
    - python3 test_core.py --skip-build --executable build/test_telemetry
    - python3 test_sender.py build/telemetry_send
    - python3 test_sender_limits.py build/telemetry_send
    - cmake --install build --prefix "$CI_PROJECT_DIR/stage"
    - cpack --config build/CPackConfig.cmake -G TGZ -B dist
  artifacts:
    paths: [dist/*.tar.gz]
    expire_in: 14 days

# Opt in only when the company has registered a Windows amd64 shell runner.
windows-amd64:
  stage: verify
  tags: [windows, amd64]
  rules:
    - if: '$RUN_WINDOWS_BUILD == "1"'
  script:
    - cmake -S . -B build -A x64
    - cmake --build build --config MinSizeRel --parallel 2
    - ctest --test-dir build -C MinSizeRel --output-on-failure
    - python test_core.py --skip-build --executable build/MinSizeRel/test_telemetry.exe
    - python test_sender.py build/MinSizeRel/telemetry_send.exe
    - python test_sender_limits.py build/MinSizeRel/telemetry_send.exe
    - cpack --config build/CPackConfig.cmake -C MinSizeRel -G ZIP -B dist
  artifacts:
    paths: [dist/*.zip]
    expire_in: 14 days
