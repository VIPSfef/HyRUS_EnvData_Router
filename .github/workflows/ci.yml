name: Build, test, and package

# Two native x64 builds produce four application executables in build/.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            preset: linux-x64
            suffix: ''
            artifact: mavlink_telemetry_data_router-linux-x64
          - name: Windows x64
            os: windows-2025
            preset: windows-x64
            suffix: .exe
            artifact: mavlink_telemetry_data_router-windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          test "$(uname -m)" = x86_64
          sudo apt-get update
          sudo apt-get install --yes ninja-build gcc libcurl4-openssl-dev:amd64
      - name: Set up Windows x64 SDK libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C tools were not found' }
          $devCmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $commandLine = 'call "{0}" -no_logo -arch=x64 -host_arch=x64 && set' -f $devCmd
          $lines = & cmd /d /s /c $commandLine
          if ($LASTEXITCODE -ne 0) { throw 'Windows compiler environment setup failed' }
          foreach ($line in $lines) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Configure Linux x64
        if: runner.os == 'Linux'
        run: |
          cmake --preset linux-x64-tests -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_FLAGS=-m64 -DCMAKE_EXE_LINKER_FLAGS=-m64 \
            -DCURL_NO_CURL_CMAKE=TRUE \
            -DCURL_INCLUDE_DIR=/usr/include/x86_64-linux-gnu \
            -DCURL_LIBRARY=/usr/lib/x86_64-linux-gnu/libcurl.so
      - name: Configure Windows x64
        if: runner.os == 'Windows'
        run: |
          cmake --preset windows-x64-tests -DCMAKE_C_COMPILER=clang-cl \
            -DCMAKE_C_FLAGS=--target=x86_64-pc-windows-msvc
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-tests
      - name: Verify executable architectures
        run: |
          python src/tests/test_arch.py build/${{ matrix.preset }}/mavlink_telemetry_data_router_headless${{ matrix.suffix }} --arch x64
          python src/tests/test_arch.py build/${{ matrix.preset }}/mavlink_telemetry_data_router_interactive${{ matrix.suffix }} --arch x64
      - name: C tests on target executables
        run: ctest --preset ${{ matrix.preset }}-tests
      - name: Independently parse JSON fixtures
        run: python src/tests/test_core.py --skip-build --executable build/${{ matrix.preset }}/tests/test_telemetry${{ matrix.suffix }}
      - name: Loopback HTTP integration tests
        run: python src/tests/test_sender.py build/${{ matrix.preset }}/mavlink_telemetry_data_router_headless${{ matrix.suffix }}
      - name: Confirmed batch release
        run: python src/tests/test_confirmation.py build/${{ matrix.preset }}/mavlink_telemetry_data_router_headless${{ matrix.suffix }}
      - name: Monitor settings and POSIX PTY tests
        run: python src/tests/test_monitor.py build/${{ matrix.preset }}/mavlink_telemetry_data_router_headless${{ matrix.suffix }} --interactive-executable build/${{ matrix.preset }}/mavlink_telemetry_data_router_interactive${{ matrix.suffix }}
      - name: Maximum JSON capacity
        run: python src/tests/test_sender_limits.py build/${{ matrix.preset }}/mavlink_telemetry_data_router_headless${{ matrix.suffix }}
      - name: Install and package tested target
        run: |
          cmake --install build/${{ matrix.preset }}
          cmake --build --preset package-${{ matrix.preset }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/${{ matrix.preset }}/mavlink_telemetry_data_router_headless${{ matrix.suffix }}
            build/${{ matrix.preset }}/mavlink_telemetry_data_router_interactive${{ matrix.suffix }}
            build/packages/*.zip
            build/packages/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
