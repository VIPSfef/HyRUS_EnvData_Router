name: Build, test, and package

# Publish the contents of telemetry_batch/ as the repository root.
# This workflow stores CI artifacts; it does not publish GitHub releases.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            os: ubuntu-24.04
            cc: gcc
            suffix: ''
            package: TGZ
            artifact: telemetry-linux-amd64
          - name: Windows AMD64
            os: windows-2025
            cc: clang
            suffix: .exe
            package: ZIP
            artifact: telemetry-windows-amd64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libcurl4-openssl-dev
      - name: Set up Windows SDK and AMD64 libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C tools were not found' }
          $devCmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $lines = & cmd /d /s /c "call `"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && set"
          if ($LASTEXITCODE -ne 0) { throw 'Windows compiler environment setup failed' }
          foreach ($line in $lines) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: C tests
        run: ctest --test-dir build --output-on-failure
      - name: Independently parse JSON fixtures
        run: python test_core.py --skip-build --executable build/test_telemetry${{ matrix.suffix }}
      - name: Loopback HTTP integration tests
        run: python test_sender.py build/telemetry_send${{ matrix.suffix }}
      - name: Package
        run: cpack --config build/CPackConfig.cmake -G ${{ matrix.package }} -B dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
